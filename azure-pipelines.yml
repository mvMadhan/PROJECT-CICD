trigger: none

pool:
  name: linuxagents  # Replace with your self-hosted agent pool

steps:
- script: echo "Hello from self-hosted agent!"
  displayName: 'Test script'
  
- script: |
    echo "Agent name: $(agent.name)"
    echo "System info:"
    echo "OS: $(uname -a)"
    echo "CPU: $(lscpu | grep 'Model name')"
    echo "Memory: $(free -h)"
    echo "Disk: $(df -h)"
  displayName: 'Show Linux agent details'